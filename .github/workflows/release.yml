name: release

# The bundled datasets are gitignored, so a wheel can only be built after the
# data pipeline has run. That is why this rebuilds the data rather than reusing
# a checkout artifact.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach artifacts to'
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  build:
    name: Build and attach distributions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Hatch
      run: pip install --upgrade hatch

    - name: Check tag matches package version
      run: |
        version=$(hatch version)
        # Tags in this repo are sometimes suffixed, e. g. 3.0.2-admin1, so the
        # version only has to be the prefix.
        case "${TAG#v}" in
          "$version"|"$version"-*) echo "Tag $TAG matches version $version" ;;
          *) echo "::error::Tag $TAG does not match package version $version"; exit 1 ;;
        esac

    - name: Cache datasets
      uses: actions/cache@v4
      with:
        path: datasets/
        key: datasets-${{ hashFiles('bin/download_data.py') }}
        restore-keys: |
          datasets-

    - name: Download data
      run: hatch run geonamescache-dev:python bin/download_data.py

    - name: Create JSON files
      env:
        GEONAMES_USER: ${{ secrets.GEONAMES_USER }}
      run: hatch run geonamescache-dev:make json

    - name: Run tests
      run: hatch test --randomize --retries 2 --retry-delay 1

    - name: Build wheel and sdist
      run: hatch build --clean

    - name: Attach distributions to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$TAG" dist/* --clobber
